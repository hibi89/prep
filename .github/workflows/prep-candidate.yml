name: PREP candidate tests (manual, no auto-spend)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prep-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run --json
